[workspace]
members = ["crates/craft-canvas-model", "crates/craft-canvas-egui"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/avacadorun-dev/craft-canvas"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value", "arbitrary_precision"] }
thiserror = "=2.0.21"
egui = "=0.36.2"
craft-canvas-model = { path = "crates/craft-canvas-model" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
